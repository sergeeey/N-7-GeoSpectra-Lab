    statement: "REFUTES the proposed C60 ('a sector-only automorphism relates k=I and k=s3, making the KO-2/KO-4 split of C57 a gauge artifact') and thereby PROVES, rather than merely asserts, C57's characterization ('the choice between KO 2 and KO 4 is internal to J, not geometric'). Derived transformation law: for V = I_M (x) v (sector-only unitary) and J = J_M (x) (k . conj), (V J V^-1)(x (x) y) = J_M x (x) [v k v^T] conj(y), so k' = v k v^T (NOT v k v^dagger -- the extra transpose comes from J's antilinearity). [VERIFIED-numpy] G1: the commutant of s3 (D_block's sector part) among general 2x2 v is EXACTLY the 2 diagonal directions (SVD null space) -- any V preserving D_block exactly must be sector-diagonal. [VERIFIED-sympy+numpy] G2: for diagonal v=diag(v1,v2), v s1 v^dagger is proportional to s1 IFF v1=+-v2 -- generic phases fail. [VERIFIED-sympy] G3/G4, proved for ALL admissible v = diag(e^{i alpha}, sigma e^{i alpha}), sigma=+-1, AT ONCE, not spot-checked: k=I's orbit stays EXACTLY {phase*I} and k=s3's orbit stays EXACTLY {phase*s3} -- sigma cancels (sigma^2=1) from both. Since I and s3 are linearly independent 2x2 matrices, these are two DISJOINT 1-complex-dimensional rays that can never meet. [VERIFIED] G5 discriminator: the same machinery correctly recovers the KNOWN TRIVIAL equivalence k=I ~ e^{i theta} I (exact solution alpha=theta/2), confirming the search is not simply failing to find anything. TWO HARNESS BUGS CAUGHT AND FIXED BEFORE ACCEPTING THE VERDICT, neither touching the underlying algebra: (1) G3/G4 initially compared symbolic matrices containing a free sigma via sympy's == , which does not know sigma^2=1 unless told, returning False despite correct algebra -- fixed by substituting sigma=+1 and sigma=-1 explicitly and requiring BOTH to match; (2) G5 initially grid-searched 2000 points over [0,2pi] with tolerance 1e-6, far tighter than the ~pi/1000 grid spacing, missing the exact solution alpha=0.45 -- fixed by solving e^{2i alpha}=e^{i theta} directly (alpha=theta/2) instead of searching."
