schema:
  # Added 2026-08-10 after an external review named a machine-readable claim
  # registry as the highest-value next step. This ledger was ALREADY
  # machine-readable YAML; what it lacked was two STRUCTURED fields for the
  # thing that actually kept going wrong this week -- a locally-true fact
  # silently inheriting the status of the interpretation printed next to it.
  #
  # Populated for C32-C36 (this session's claims), not retrofitted across all
  # 37 -- backfilling scope limits onto older claims from memory would be the
  # same guessing this field exists to prevent. Add them as claims are touched.
  required:
    - id
    - statement
    - truth_status        # allowed values: see `enums` below
    - test_outcome        # allowed values: see `enums` below
    - execution_status
    - evidence_status
    - lifecycle_status
    - evidence_file
    - depends_on
  # CANONICAL vocabulary for the five status fields (2026-10-03). This is the
  # single source of truth: scripts/lint_claim_ledger.py reads it from here and
  # tests/test_lint_claim_ledger.py fails if any entry uses a value not listed.
  # The older prose lists in the file header and in earlier versions of this
  # block disagreed with each other and with actual use; the values marked
  # (used) were already in use and are now declared rather than guessed away.
  #   test_outcome  PARTIAL (used): some checks passed, others failed or were not run
  #   test_outcome  There is deliberately NO "NULL" value. Seven entries (C141,
  #                 C144, C146-C150) had an UNQUOTED `NULL`, which YAML parses as
  #                 null, silently erasing the field. On 2026-10-03 each was
  #                 reassigned from its OWN text, not by a blanket rule: C141 FAIL
  #                 (pre-registered discrimination did not discriminate, same
  #                 pattern as C3/C14/C24: supported negative finding), C144 PASS
  #                 (exact symbolic match, 64/64 entries), C146 PASS (proved, four
  #                 checks), C147 PASS (exact similarity, det 4/3), C149 PASS
  #                 (commutator exactly 0, negative control fails as required),
  #                 C148 and C150 NOT_RUN (their own text: no new computation).
  #                 Reversible via git if a different reading is preferred.
  #   truth_status  PARTIALLY_SUPPORTED (used once, C94): part of the statement
  #                 supported, the rest unresolved
  #   evidence_status VERIFIED_EXTERNAL_SOURCE (used once, C67): a primary
  #                 external source was read directly (not an internal certificate)
  #
  # TWO STATUSES, TWO QUESTIONS (2026-10-03).
  #   truth_status   = the status of the proposition AS WORDED in `statement`. For an
  #                    entry that records a negative result this is often the status
  #                    of the ORIGINAL HYPOTHESIS ("REFUTED as worded").
  #   finding_status = what the entry ITSELF records as established, i.e. what later
  #                    claims may rely on. When absent it equals truth_status.
  #                    REQUIRED when truth_status is REFUTED (that is exactly where
  #                    the two diverge: the hypothesis is refuted, the finding stands).
  #       ESTABLISHED  the recorded finding stands, positive or negative, and the
  #                    entry's own `caveat` / `does_not_imply` state no limit on the
  #                    finding itself (disclaimers about OTHER claims or consequences,
  #                    e.g. "does not imply N_gen=3", do not count as such a limit)
  #       QUALIFIED    stands, but the entry's OWN `caveat` or `does_not_imply` states a
  #                    limit on the finding itself: its strength or validity
  #                    conditions, or an untested relaxation or variant that could
  #                    overturn the broader reading (typical for a negative result:
  #                    "only this construction was tested"). The limit must be written
  #                    in this entry's own `caveat`/`does_not_imply` (not in `notes`,
  #                    not in a dependant's caveat); the linter checks it exists (L10),
  #                    not that the ESTABLISHED/QUALIFIED boundary was drawn well.
  #       OPEN         the entry poses a question of its own and leaves it unanswered.
  #                    A later entry may have answered it (then lifecycle is SUPERSEDED
  #                    and the successor is named in the text).
  #       RETRACTED    the recorded content was withdrawn (lifecycle_status must be
  #                    SUPERSEDED or RETIRED; no ACTIVE PROVED/SUPPORTED claim may
  #                    depend on it). SUPERSEDED alone does not mean RETRACTED.
  #   test_outcome   = the outcome of the test of the hypothesis that MOTIVATED the
  #                    entry. So truth_status SUPPORTED + test_outcome FAIL is the
  #                    normal shape of a supported negative finding (C3, C14, C24,
  #                    C141), not an inconsistency.
  #   depends_on     means "relies on". To cite a claim you correct or retract, name
  #                    it in `supersedes`, not in `depends_on`.
  # The 15 REFUTED entries were classified on 2026-10-03 by reading each one, then
  # checked by an independent BLIND classification (an agent given only the
  # definitions and the entry texts, not these values). First pass: 9/15 agreed,
  # including every value that drives a lint rule (RETRACTED C28 C31, OPEN C151);
  # all 6 disagreements were on the ESTABLISHED/QUALIFIED boundary and traced to
  # an ambiguous QUALIFIED definition, which was sharpened above. Final:
  #   ESTABLISHED: C10 C22 C27 C110
  #   QUALIFIED:   C16 C45 C107 C119 C121 C145 C154 C156 (each states a limit on the
  #                finding in its own caveat/does_not_imply, e.g. C45 "only axioms
  #                available at this stage", C107 "only the simplest map tested",
  #                C145 "only the lambda=0 identification tested", C156 "hypothesis
  #                S is vacuous, not false; A_4, C_3, D_4 untested")
  #   OPEN:        C151 (its own third pre-committed outcome: question unanswered;
  #                its successor C152 is named in its text)
  #   RETRACTED:   C28 C31 (both lifecycle SUPERSEDED; C31's conclusion was
  #                reinstated by C33, but this entry's recorded reasoning was not)
  # After the sharpening 14/15 agree with the blind classification; that is NOT
  # independent confirmation (the rule came from the blind classifier's own sort).
  # The independent evidence is the 9 pre-sharpening matches. C156 differs
  # (blind: ESTABLISHED, runner-up QUALIFIED) and stays QUALIFIED because its own
  # does_not_imply states scope limits. Judgement calls, reversible via git.
  # Known gaps, not changed: C10 stays ESTABLISHED although C16's caveat says the
  # framing of C10's zeros was retroactively weakened (the limit lives in C16 and in
  # C10's `notes`, not in C10's own caveat); C31 and C151 are better read as
  # "reasoning retracted / question later answered by C33 / C152" than by one value.
  enums:
    truth_status: [PROVED, SUPPORTED, PARTIALLY_SUPPORTED, CONDITIONAL, OPEN, REFUTED]
    finding_status: [ESTABLISHED, QUALIFIED, OPEN, RETRACTED]
    test_outcome: [PASS, FAIL, PARTIAL, INCONCLUSIVE, CONFLICTING, NOT_RUN]
    execution_status: [READY, RUNNING, BLOCKED_INFRA, UNTRUSTED_ENV]
    evidence_status: [ABSENT, PARTIAL, INTERNALLY_CERTIFIED, INDEPENDENTLY_REPRODUCED, EXTERNALLY_REVIEWED, FORMALLY_CHECKED, VERIFIED_EXTERNAL_SOURCE, INVALIDATED, CONTESTED]
    lifecycle_status: [ACTIVE, PARKED, SUPERSEDED, RETIRED]
  optional:
    - notes
    - caveat
    - supersedes
    - finding_status:
        why: >
          Separates the status of the HYPOTHESIS (truth_status: the proposition as
          worded) from the status of the FINDING the entry records. Without it a
          negative result ("hypothesis REFUTED, finding PROVED") is indistinguishable
          from a retracted claim, so later claims that legitimately build on the
          negative finding look like they rest on a refuted premise. Required when
          truth_status is REFUTED; otherwise it defaults to truth_status. Values and
          rules: see the comment above `enums`; enforced by
          scripts/lint_claim_ledger.py (L9, L10, L11).
    - convention:
        why: >
          Which sign/Clifford/operator convention the claim is stated in.
          Required whenever the claim's TRUTH depends on it -- reality type,
          signature, KO-dimension, any antilinear operator. Direct consequence
          of C34: this repo used Cl(p,q) with two opposite meanings for months,
          and OB10 tensored across the boundary without noticing. See
          docs/clifford_convention_registry.md rule 3.
    - does_not_imply:
        why: >
          Explicit list of what the claim does NOT license. This is the field
          the week's failures needed most. Three separate incidents had the
          same shape -- a verified local fact sitting next to an unverified
          interpretation, and the interpretation inheriting the "verified"
          status by adjacency: (1) Cl(7,0) label read as a computational fact
          when only the anticommutator was checked; (2) "0 solutions found"
          read as "no solutions exist" when the search could not have found
          any; (3) "KO-dim 6 relations verified" read as "KO-dim 6 verified"
          when only the three relations were. Prose caveats did not stop any of
          them, because prose is not queryable. A field is.

notes_on_this_ledger:
  - "199 entries as of C219 (2026-10-03): C218 and two C219 entries added (verify with `grep -c \"^  - id:\" CLAIM_LEDGER.yaml`). C219 is the first round in this ledger whose headline finding is a correction of an inherited fitted constant (rho6* 1.090 -> 1.154); downstream numbers are NOT updated in the ledger, only flagged."
