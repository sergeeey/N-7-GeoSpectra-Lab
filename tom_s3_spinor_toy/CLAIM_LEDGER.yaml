    statement: "THE C45 FLAG WAS A FALSE ALARM, carried for ten rounds. C45 recorded U_iota^2 = +-1 as OPEN and 'needed for gamma^dag = gamma'; after C55 discharged A1 it was the only named unknown left in the line. Nothing was discovered here except that the worry did not apply. gamma enters only through gamma^dag = gamma, gamma^2 = +1 and {gamma,D} = 0, and only ever up to a phase. [VERIFIED-numpy, explicit mirror-block model] with gamma = c * U_iota (x) s1: for U_iota^2 = +1 (U_iota self-adjoint) c = +-1 works and c = +-i FAILS; for U_iota^2 = -1 (U_iota ANTI-self-adjoint) c = +-i works and c = +-1 FAILS. In the second case the phase does both jobs at once -- gamma^2 = i^2 * (-1) = +1, and gamma^dag = gamma because the imaginary phase compensates the anti-self-adjointness. The MISMATCHED pairings genuinely fail, so this is not a vacuous rescue; {gamma,D} = 0 holds in all eight rows because it is phase-blind, which is shown rather than hidden. WHY THE PHASE FREEDOM EXISTS: by C55, U_iota maps (j, j+-1/2) onto (j+-1/2, j) and j != j+-1/2 always, so U_iota is PURELY OFF-DIAGONAL on the mirror pairs; an operator with no fixed blocks has U^2 = +1 iff self-adjoint, and multiplying by i moves between the two cases. WHAT THE SIGN DOES NOT AFFECT: [VERIFIED-numpy] ||[D_M,V]|| = 11.0, 19.0, 35.0, 67.0 at cutoffs 4, 8, 16, 32 -- IDENTICAL for both lifts, since [D_M, cV] = c[D_M,V]. So C50/C51/C53/C54's 'V not in B' is untouched, C52's locality argument never sees a phase, and C55's L<->R swap never sees a phase. WHAT IT DOES AFFECT: [AMENDED 2026-08-10 by C57, same day -- this sub-claim was WRONG] U5 concluded that the eps'' sign of the KO tuple FLIPS with the choice, from J(cX)J^-1 = conj(c) J X J^-1. That accounting was INCOMPLETE: it never asked what J_M does to U_iota, which carries the same phase in the opposite direction. C57 shows gamma = (c c') W (x) s1 = +-(W (x) s1) is the SAME REAL operator for both Pin choices and the two flips cancel exactly, so the tuple is PIN-INDEPENDENT. The original text is kept because it was the reasoning that motivated running C57. That is precisely the combination C48 declined to make, and the abstention now has a REASON rather than only a caution: the combination depends on a choice nothing in the construction fixes. GEOMETRIC SIDE: in the project's canonical S^3 convention (Z_i = i*sigma_i, e^2 = -1, Cl(0,3), which docs/clifford_convention_registry.md marks as correctly labelled) omega = Z1 Z2 Z3 = +I and omega^2 = +I, so the FIBRE part of the lift of d(iota)|_p = -Id at a fixed point squares to +1; the opposite convention (Gamma_i = sigma_i, e^2 = +1) gives omega = iI, omega^2 = -I. So the sign of omega^2 IS the convention, not a geometric fact -- C34's point arriving a third time."
