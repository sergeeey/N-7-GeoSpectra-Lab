  - id: C59_A1LIFT_DISCHARGED_BY_SCHUR
    statement: "ASSUMPTION A1-lift (flagged in C55: 'the geometric spinor lift may differ from the bare pullback by a unitary... a much weaker input than A1 itself, but it IS an input') is DISCHARGED: it is a THEOREM, not an assumption. iota(ag) = g^-1 a^-1 is pure group associativity, so iota intertwines LEFT translation by a with RIGHT translation by a^-1; any unitary U implementing iota EQUIVARIANTLY in this sense -- which is what 'lift of an isometry' means, independent of Clifford sign, metric convention, or Pin choice -- is forced by SCHUR'S LEMMA to map the (j,k) isotypic block ONLY to (k,j), unique up to a phase, because V_j (x) V_k* is one irrep per factor of a product group. VERIFIED NUMERICALLY, not just cited: the equivariance condition was built from explicit su(2) generator matrices (Jx,Jy,Jz for j=0,1/2,1,3/2, commutators and Hermiticity checked) and solved as a linear system via SVD null-space, rather than trusted from Lie-algebra bookkeeping by hand. [VERIFIED-numpy] S2 -- every matching pair (twisted-(j,k) -> plain-(k,j), tested for (0,1/2),(1/2,1),(1,1/2),(3/2,1),(1,1)) gives EXACTLY null dim 1: existence AND uniqueness. [VERIFIED-numpy] S3, the load-bearing negative control -- SAME total dimension, label NOT swapped (twisted-(1,0)->plain-(1,0), twisted-(1/2,3/2)->plain-(1/2,3/2)) gives null dim 0: dimension-matching alone does not force a solution, only the label match does (the j=k rows give 1 correctly, since then (j,k) IS its own (k,j)). [VERIFIED-numpy] S4 -- different-dimension pairs trivially 0. [VERIFIED-numpy] S5 -- applied to C55's own (0,1/2) pair (the n=0 level): dimension 1, exactly the phase freedom C56 exploited (c=+-1 or +-i) -- C56/C57 corroborated, not contradicted. A REAL BUG WAS CAUGHT AND FIXED IN THIS FILE: the first version's dual_generators returned conj(J) for the contragredient generator, which flips the su(2) commutator's sign ([conj(Jx),conj(Jy)]=-i*conj(Jz), not +i) and is therefore not even a valid representation on i