    statement: "REFUTES the proposed C57 as worded and CORRECTS my own C56. C56's U5 said the eps'' sign of the KO tuple FLIPS with the Pin+/Pin- choice; it does NOT. U5 looked only at J(cX)J^-1 = conj(c) J X J^-1 and never asked what J_M does to U_iota. [VERIFIED-numpy] writing U_iota = c'*W with W the REAL swap, C56's own condition c*c' = +-1 makes gamma = (c c')*W (x) s1 = +-(W (x) s1) -- the SAME REAL OPERATOR for both Pin choices -- and because gamma is real, J gamma J^-1 = M gamma M^-1 carries no phase at all. The conj(c)/c flip is exactly compensated by eta = J_M U_iota J_M^-1 / U_iota = conj(c')/c': Pin+ gives (+1)(+1), Pin- gives (-1)(-1), net +1 both ways. THE PIN CHOICE CANCELS. WHAT THE TUPLE IS: [VERIFIED-numpy] eps = J^2 = -1 for every DIAGONAL k, inherited from J_M^2 = -1; eps' = +1 is FORCED because the D_M part cannot flip, and it forces [k,s3] = 0, i.e. k diagonal -- s1 and s2 FAIL outright; J gamma = eps'' gamma J then narrows k to {I, s3} up to phase, and diag(1,i) FAILS. Result: k = I gives (-1,+1,+1) -> KO-dimension 4; k = s3 gives (-1,+1,-1) -> KO-dimension 2; diag(1,-1) = -s3 gives the same tuple as s3, a coherence check that the phase of k does not matter. The choice between KO 2 and KO 4 is INTERNAL to J, not geometric, and nothing in the construction selects it. Metric dimension is 3 (Weyl asymptotics of D_block on S^3 (+) S^3), so the KO - metric mismatch is 7 or 1 mod 8 -- reported, not interpreted. CONTROL: the machinery recovers the S^3 factor's own declared tuple (J_M^2 = -1, J_M D_M J_M^-1 = +D_M, no gamma) -> KO-dim 3, which is the least it must do before its other outputs are trusted. SCOPE FIX RECORDED: claim.md predicted eps = -1 for k unitary DIAGONAL, but the first version of the assertion ran over ALL k and reported False, because s2 is IMAGINARY and s2 conj(s2) = -I makes the two minus signs cancel (eps = +1). The claim was right, the test was wider than the claim; s2 is excluded by eps' anyway."
