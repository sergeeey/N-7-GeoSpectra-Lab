    statement: "Tests whether the 'r-untouched' ansatz (B_1=M_1(x)I_r, used throughout C101-C103/C105, flagged as a postulated/unverified simplification in every relevant claim.md) is load-bearing for the exactly-real coupled D_PW spectrum, by building a physically-motivated alternative that DOES couple to r: B_1^Gamma:=sum_i M_1^{(i)}(x)rmult_i, a Clifford-type coupling mirroring D-bar's own vector-index-contraction pattern (D_k_bar=-sum_i l_{e_i}(k)(x)rmult_i). M_1^{(i)} (Cartesian, i=1,2,3) is built via an EXACT linear combination of C104's own 4 (a,b) CG-component matrices, using the same quaternion<->SU(2)-matrix convention c85's own hamilton_product/right_mult_matrix_on_ab already use -- no new fundamental construction. Preliminary scratch exploration (disclosed in claim.md) found a new exact algebraic fact: L_i(1)=-rmult_i for i=1,2,3, IDENTITY similarity transform (no basis change) -- i.e. r-space is literally (up to a global sign) the same 2-dim carrier as q-space at level 1, not an independent auxiliary space. RESULT: all 6 predictions confirmed. P0 (L_i(1)=-rmult_i exact) CONFIRMED. P1 (shape match, valid drop-in replacement) CONFIRMED. P2 (genuinely different from r-untouched B_plain) CONFIRMED. P3 (r-coupled D_PW has exactly real spectrum, max|Im|=0.0) CONFIRMED -- matches C101-C103's r-untouched result under a genuinely different, r-touching construction. P4 (negative control: fully asymmetric random real coupling gives clearly non-real spectrum, max|Im| in [2.57,3.00] across 4 trials) CONFIRMED -- rules out a vacuously-always-real eigensolver. P5 (negative control: random B/B.T-mirrored real couplings are only SOMETIMES real, not universal -- 3/8 trials exactly real, 5/8 clearly non-real, max|Im| in [0.08,0.18]) CONFIRMED -- rules out D1/D2's own eigenvalue degeneracy trivially forcing reality for any mirrored coupling, so both the r-untouched and this round's r-coupled results are genuine, non-generic findings tied to the actual CG/su(2) structure. P