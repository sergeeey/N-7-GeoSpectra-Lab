schema:
  # Added 2026-08-10 after an external review named a machine-readable claim
  # registry as the highest-value next step. This ledger was ALREADY
  # machine-readable YAML; what it lacked was two STRUCTURED fields for the
  # thing that actually kept going wrong this week -- a locally-true fact
  # silently inheriting the status of the interpretation printed next to it.
  #
  # Populated for C32-C36 (this session's claims), not retrofitted across all
  # 37 -- backfilling scope limits onto older claims from memory would be the
  # same guessing this field exists to prevent. Add them as claims are touched.
  required:
    - id
    - statement
    - truth_status        # PROVED | SUPPORTED | CONDITIONAL | OPEN | REFUTED
    - test_outcome        # PASS | FAIL
    - execution_status
    - evidence_status
    - lifecycle_status    # ACTIVE | SUPERSEDED
    - evidence_file
    - depends_on
  optional:
    - notes
    - caveat
    - supersedes
    - convention:
        why: >
          Which sign/Clifford/operator convention the claim is stated in.
          Required whenever the claim's TRUTH depends on it -- reality type,
          signature, KO-dimension, any antilinear operator. Direct consequence
          of C34: this repo used Cl(p,q) with two opposite meanings for months,
          and OB10 tensored across the boundary without noticing. See
          docs/clifford_convention_registry.md rule 3.
    - does_not_imply:
        why: >
          Explicit list of what the claim does NOT license. This is the field
          the week's failures needed most. Three separate incidents had the
          same shape -- a verified local fact sitting next to an unverified
          interpretation, and the interpretation inheriting the "verified"
          status by adjacency: (1) Cl(7,0) label read as a computational fact
          when only the anticommutator was checked; (2) "0 solutions found"
          read as "no solutions exist" when the search could not have found
          any; (3) "KO-dim 6 relations verified" read as "KO-dim 6 verified"
          when only the three relations were. Prose caveats did not stop any of
          them, because prose is not queryable. A field is.

