risk_register:
  - risk: overreliance on AI
    cause: Gate 4B explained fluently
    detection: user skips CLAIMS_AND_CAVEATS
    mitigation: Awareness Gate
    severity: medium
  - risk: false confidence
    cause: PASS_WITH_CAVEATS read as PASS
    detection: missing caveats in summary
    mitigation: caveat-first template
    severity: high
  - risk: hallucinations
    cause: Ben Achour formulas without source
    detection: grep empty
    mitigation: needs_more_data + block code
    severity: high
  - risk: context contamination
    cause: session spec = truth
    detection: P13A-G fixed claim vs repo
    mitigation: Environment Gate grep
    severity: high
  - risk: scope_explosion
    cause: megaprompt
    detection: >1 deliverable class per call
    mitigation: CAP 4-call split
    severity: medium
  - risk: bootstrap paradox
    cause: evaluate before build
    detection: Call 3 scope creep
    mitigation: layers 1–6 only rule
    severity: high
  - risk: persona_conflict
    cause: physics hype vs verifier
    detection: FORBIDDEN claims appear
    mitigation: Awareness card
    severity: medium
  - risk: LLM judge bias
    cause: self-score metrics
    detection: no human rubric
    mitigation: human_review required
    severity: medium
  - risk: analysis paralysis
    cause: too many gates
    detection: no first_action executed
    mitigation: MVP day plan
    severity: low
  - risk: privacy leakage
    cause: secrets in prompt
    detection: pre-commit
    mitigation: privacy boundary
    severity: low
  - risk: prompt injection
    cause: malicious doc in repo
    detection: adversarial test
    mitigation: refuse override caveats
    severity: medium
  - risk: model drift
    cause: different model per session
    detection: regression golden set
    mitigation: method_version_card model note
    severity: low
  - risk: loss of human agency
    cause: AI decides promote
    detection: git push without user ask
    mitigation: human_decision_boundary
    severity: critical

known_unknowns:
  - Golden set baseline timing for CAP vs megaprompt
  - Optimal gate count before paralysis
  - Team adoption outside solo maintainer

